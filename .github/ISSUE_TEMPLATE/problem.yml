name: Problem report
description: Something in Termenbox did not work (opened from the app's Report a problem button)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, the actual result and the expected result.
      value: |
        Steps to reproduce:
        1.

        Actual result:

        Expected result:
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Filled in by the app. It contains the app version, browser, screen numbers, connection state and recent error messages, with certificates, secrets, tokens and addresses removed. Please read it before submitting.
      render: text
