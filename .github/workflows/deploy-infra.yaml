name: Deploy Cloud Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      environment:
        description: 'Target environment (currently only "cloud")'
        required: true
        type: choice
        options:
          - cloud

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: '1.9'
  TF_WORKING_DIR: infra/termanch-cloud

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }} (cloud)
    runs-on: ubuntu-latest
    environment: cloud
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Configure credentials
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
          echo "GITHUB_ACTIONS_TOKEN=${{ secrets.TERMANCH_GITHUB_ACTIONS_TOKEN }}" >> $GITHUB_ENV

      - name: Initialize Terraform
        run: |
          terraform init -input=false \
            -backend-config="endpoint=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        run: |
          terraform plan -input=false -out=tfplan \
            -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
            -var="cloudflare_zone_name=${{ secrets.CLOUDFLARE_ZONE_NAME }}" \
            -var="cloudflare_pages_deploy_token=${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}" \
            -var="github_actions_token=${{ secrets.TERMANCH_GITHUB_ACTIONS_TOKEN }}" \
            -var="github_oauth_client_id=${{ secrets.TERMANCH_GITHUB_OAUTH_CLIENT_ID }}" \
            -var="github_oauth_client_secret=${{ secrets.TERMANCH_GITHUB_OAUTH_CLIENT_SECRET }}" \
            -var="github_repository=${{ github.repository }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: |
          if [ -f tfplan ]; then
            terraform apply -input=false tfplan
          else
            terraform apply -input=false -auto-approve \
              -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
              -var="cloudflare_zone_name=${{ secrets.CLOUDFLARE_ZONE_NAME }}" \
              -var="cloudflare_pages_deploy_token=${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}" \
              -var="github_actions_token=${{ secrets.TERMANCH_GITHUB_ACTIONS_TOKEN }}" \
              -var="github_oauth_client_id=${{ secrets.TERMANCH_GITHUB_OAUTH_CLIENT_ID }}" \
              -var="github_oauth_client_secret=${{ secrets.TERMANCH_GITHUB_OAUTH_CLIENT_SECRET }}" \
              -var="github_repository=${{ github.repository }}"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -input=false -auto-approve \
            -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
            -var="cloudflare_zone_name=${{ secrets.CLOUDFLARE_ZONE_NAME }}" \
            -var="cloudflare_pages_deploy_token=${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}" \
            -var="github_actions_token=${{ secrets.TERMANCH_GITHUB_ACTIONS_TOKEN }}" \
            -var="github_oauth_client_id=${{ secrets.TERMANCH_GITHUB_OAUTH_CLIENT_ID }}" \
            -var="github_oauth_client_secret=${{ secrets.TERMANCH_GITHUB_OAUTH_CLIENT_SECRET }}" \
            -var="github_repository=${{ github.repository }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Output Client URL
        if: github.event.inputs.action == 'apply'
        run: |
          echo "Client URL: $(terraform output -raw client_url)"
          echo "OAuth Client ID: $(terraform output -raw oauth_client_id)"
          echo "OAuth Client Secret: $(terraform output -raw oauth_client_secret)"