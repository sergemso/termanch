name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
    paths: ['packages/client/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/deploy-pages.yaml']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          # Include source files in cache key so any source change invalidates cache
          cache-dependency-path: |
            packages/client/pnpm-lock.yaml
            packages/client/src/**

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear Vite cache
        run: |
          rm -rf packages/client/node_modules/.vite
          rm -rf packages/client/node_modules/.cache
          rm -rf packages/client/dist

      - name: Build client
        run: pnpm --filter termenbox-client run build
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Configure Pages project
        working-directory: packages/client
        run: |
          cat > wrangler.toml <<EOFF
          name = "${{ vars.TERMENBOX_PAGES_PROJECT_NAME || 'termenbox' }}"
          pages_build_output_dir = "dist"
          compatibility_date = "2026-10-01"

          [[d1_databases]]
          binding = "DB"
          database_name = "termanch-directory"
          database_id = "${{ vars.TERMENBOX_D1_DATABASE_ID }}"
          migrations_dir = "migrations"
          EOFF

      - name: Apply directory migrations
        if: ${{ vars.TERMENBOX_D1_DATABASE_ID != '' }}
        working-directory: packages/client
        run: wrangler d1 migrations apply termanch-directory --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Pages Function secrets
        working-directory: packages/client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_CLIENT_ID: ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.TERMENBOX_GITHUB_CLIENT_SECRET }}
          CERT_SIGNING_KEY: ${{ secrets.TERMENBOX_CERT_SIGNING_KEY }}
        run: |
          umask 077
          node -e 'const o={};for(const k of ["GITHUB_CLIENT_ID","GITHUB_CLIENT_SECRET","CERT_SIGNING_KEY"])if(process.env[k])o[k]=process.env[k];require("fs").writeFileSync(process.env.RUNNER_TEMP+"/pages-secrets.json",JSON.stringify(o))'
          wrangler pages secret bulk "$RUNNER_TEMP/pages-secrets.json" --project-name=${{ vars.TERMENBOX_PAGES_PROJECT_NAME || 'termenbox' }}
          rm -f "$RUNNER_TEMP/pages-secrets.json"

      - name: Deploy to Cloudflare Pages
        working-directory: packages/client
        run: wrangler pages deploy dist --project-name=${{ vars.TERMENBOX_PAGES_PROJECT_NAME || 'termenbox' }} --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
