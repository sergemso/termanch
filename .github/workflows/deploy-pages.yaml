name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter termanch-client run build
        env:
          VITE_GITHUB_CLIENT_ID: ${{ vars.TERMANCH_GITHUB_CLIENT_ID }}

      - name: Install Wrangler
        run: npm install -g wrangler

      # Pages Functions are read from ./functions of the directory wrangler runs in, so deploy from the
      # client package. The directory's D1 binding is written here so each deployment (hosted or
      # self-hosted) points at its own database.
      - name: Configure Pages project
        working-directory: packages/client
        run: |
          cat > wrangler.toml <<EOF
          name = "${{ vars.TERMANCH_PAGES_PROJECT_NAME || 'termanch' }}"
          pages_build_output_dir = "dist"
          compatibility_date = "2026-10-01"

          [[d1_databases]]
          binding = "DB"
          database_name = "termanch-directory"
          database_id = "${{ vars.TERMANCH_D1_DATABASE_ID }}"
          migrations_dir = "migrations"
          EOF

      - name: Apply directory migrations
        if: ${{ vars.TERMANCH_D1_DATABASE_ID != '' }}
        working-directory: packages/client
        run: wrangler d1 migrations apply termanch-directory --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        working-directory: packages/client
        run: wrangler pages deploy dist --project-name=${{ vars.TERMANCH_PAGES_PROJECT_NAME || 'termanch' }} --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
