name: Build & Push Docker Image

on:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['docker/**', 'packages/core/**', 'packages/server/**', 'packages/agent/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/docker-build.yaml']
  # Pull requests build the image (amd64) without pushing, so a broken Dockerfile fails before merge.
  pull_request:
    paths: ['docker/**', 'packages/core/**', 'packages/server/**', 'packages/agent/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/docker-build.yaml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag (e.g. staging, latest, v1.0.0)'
        required: true
        type: string
        default: 'latest'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  # One native runner per architecture: no QEMU, so the Rust build runs at full speed. Build cache lives in GHCR
  # (the Actions cache has a 10 GB per-repository cap that two architectures' layers were filling).
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: TERMANCH_BUILD=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:${{ matrix.arch }}
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}/{1}-cache:{2},mode=max', env.REGISTRY, env.IMAGE_NAME, matrix.arch) || '' }}
      - name: Gate - compressed image size
        if: env.PUSH == 'true'
        env:
          IMAGE_MAX_MB: 160 # 119 MB when the gate was added; raise on purpose, in a reviewed change
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          raw="$(docker buildx imagetools inspect --raw "$ref@${{ steps.build.outputs.digest }}")"
          # The pushed digest may be an index (image + attestation); follow it to the real image.
          inner="$(jq -r '[.manifests[]? | select(.platform.architecture != "unknown")][0].digest // empty' <<<"$raw")"
          [ -z "$inner" ] || raw="$(docker buildx imagetools inspect --raw "$ref@$inner")"
          bytes="$(jq '[.config.size, (.layers[].size)] | add' <<<"$raw")"
          mb=$((bytes / 1048576))
          echo "compressed image size (${{ matrix.arch }}): ${mb} MB (limit ${IMAGE_MAX_MB} MB)"
          [ "$mb" -le "$IMAGE_MAX_MB" ] || { echo "image too large"; exit 1; }
      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Joins the two single-architecture images into the multi-architecture tags users pull.
  manifest:
    name: Publish manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
