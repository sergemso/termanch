name: Build Base Image

# The runtime base (node, tmux, git, ...) changes rarely. Rebuilding it weekly picks up OS security fixes;
# app builds then start FROM it and skip all package installs.
on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [master]
    paths: ['docker/Dockerfile.base', '.github/workflows/base-image.yaml']
  workflow_dispatch:
  # BOOTSTRAP ONLY: publishes the first base image from the PR that introduces it; removed in the same PR.
  pull_request:
    paths: ['docker/Dockerfile.base', '.github/workflows/base-image.yaml']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sergemso/termanch-base

jobs:
  base:
    name: Build & Push base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/Dockerfile.base
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_id }}
