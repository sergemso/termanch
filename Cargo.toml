[workspace]
members = ["packages/core", "packages/server", "packages/agent"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sergemso/termanch"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
async-trait = "0.1"
uuid = { version = "1.7", features = ["serde", "v4"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"