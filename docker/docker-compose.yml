version: '3.8'

services:
  termanch-server:
    image: ghcr.io/sergemso/termanch:latest
    container_name: termanch-server
    restart: unless-stopped
    environment:
      - TERMANCH_HOST=0.0.0.0
      - TERMANCH_PORT=8080
      - TERMANCH_PUBLIC_URL=${TERMANCH_PUBLIC_URL:-}
      - TERMANCH_CLIENT_URL=${TERMANCH_CLIENT_URL:-https://app.termanch.dev}
      - TERMANCH_SERVER_NAME=${SERVER_NAME:-termanch-server}
    volumes:
      - termanch-data:/home/termanch/.config/termanch
    networks:
      - termanch-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: termanch-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - termanch-server
    networks:
      - termanch-network

volumes:
  termanch-data:

networks:
  termanch-network:
    driver: bridge